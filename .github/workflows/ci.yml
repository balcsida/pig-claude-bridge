name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: extensions/pig-claude-bridge/go.sum
      - name: Format
        working-directory: extensions/pig-claude-bridge
        run: test -z "$(gofmt -l .)"
      - name: Vet and test
        working-directory: extensions/pig-claude-bridge
        run: go vet ./... && go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PiG
        run: npm install -g @pi-in-go/pig@0.5.3 && pig --version
      - name: Validate the extension
        run: pig install "$PWD" --validate-only --json
