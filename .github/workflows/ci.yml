name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: extensions/pig-claude-bridge/go.sum
      - name: Format
        working-directory: extensions/pig-claude-bridge
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: Vet and test
        working-directory: extensions/pig-claude-bridge
        # ./... skips testdata, where the fake Claude CLI lives.
        run: go vet ./... ./internal/ccproto/testdata/fakeclaude && go test -race ./...
      - name: Compile the live-tagged contract tests
        working-directory: extensions/pig-claude-bridge
        run: go vet -tags live ./internal/ccproto/
      - name: Compile the live integration module
        working-directory: tests/live
        run: test -z "$(gofmt -l . | tee /dev/stderr)" && go vet -tags live ./...
      - name: Self-test the live scripts (offline)
        run: |
          for f in scripts/live/*.sh; do bash -n "$f"; done
          scripts/live/run-all.sh --selftest
          bash -c 'source scripts/live/lib.sh && check_deadlock_logs --selftest'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PiG
        run: npm install -g @pi-in-go/pig@0.5.3 && pig --version
      - name: Validate the extension
        run: pig install "$PWD" --validate-only --json
